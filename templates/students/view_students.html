<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .container-box {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        .title-icon {
            font-size: 36px;
        }

        .table thead {
            background: #c9eec9;
        }

        .btn-back {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container-box">

    <div class="text-center mb-4">
        <div class="title-icon">📋</div>
        <h2 class="fw-bold">Student List</h2>
        <p class="text-muted">All registered students</p>
    </div>

    <div class="text-start">
        <a href="{% url 'add_student' %}" class="btn btn-primary btn-back">⬅ Back to Add Student</a>
    </div>

    <table class="table table-bordered table-hover text-center">
        <thead>
            <tr class="table-success">
                <th>Name</th>
                <th>Roll Number</th>
                <th>Email</th>
                <th style="width: 160px;">Action</th>
            </tr>
        </thead>

        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.name }}</td>
                <td>{{ s.roll_number }}</td>
                <td>{{ s.email }}</td>

                <td>
                    <!-- Edit -->
                    <a href="{% url 'update_student' s.id %}"
                       class="btn btn-warning btn-sm me-2">
                       Edit
                    </a>

                    <!-- Delete -->
                    <a href="{% url 'delete_student' s.id %}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Delete {{ s.name }}?');">
                        Delete
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No students added yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
