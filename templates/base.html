<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Student ERP{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#eef3f9">


<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Student ERP</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/students/add_student/">Add Students</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/students/list/">Student List</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/exams/add-subject/">Add Subject</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/exams/subjects/">Subject List</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/exams/add-exam/">Add Exam</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/exams/timetable/">Exam Timetable</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
