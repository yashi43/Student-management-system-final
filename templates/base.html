<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Student ERP{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#eef3f9">


{% if user.is_authenticated %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
    <a class="navbar-brand fw-bold" href="/">Dashboard</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">

            
            <li class="nav-item">
                <a class="nav-link" href="/students/add_student/">Add Student</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/students/list/">View Students</a>
            </li>

            
            <li class="nav-item">
                <a class="nav-link" href="/exams/add-subject/">Add Subject</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/exams/subjects/">View Subjects</a>
            </li>

            
            <li class="nav-item">
                <a class="nav-link" href="/exams/add-exam/">Add Exam</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/exams/timetable/">View Timetable</a>
            </li>

            
            <li class="nav-item">
                <a class="nav-link" href="/exams/assign-subject/">Assign Subject</a>
            </li>

            
            <li class="nav-item">
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-warning btn-sm ms-3">Logout</button>
                </form>
            </li>

        </ul>
    </div>
</nav>

{% else %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
    <a class="navbar-brand fw-bold" href="/">Student ERP</a>
    <ul class="navbar-nav ms-auto">
        <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}">Login</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'signup' %}">Sign Up</a>
        </li>
    </ul>
</nav>
{% endif %}

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
